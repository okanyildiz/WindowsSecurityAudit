name: Publish to PowerShell Gallery

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Test and publish
    # The module only works on Windows (CIM/WMI, event logs, registry), so the
    # test gate and the publish step both run on windows-latest.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests (publish gate)
        # The full suite must pass before anything is published; a failing test
        # exits with code 1 and stops the workflow before Publish-Module runs.
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Validate module manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./WindowsSecurityAudit.psd1 -ErrorAction Stop
          Write-Host "Manifest OK: $($manifest.Name) $($manifest.Version)"

      - name: Publish to PowerShell Gallery
        # Publish only when the PSGALLERY_API_KEY repository secret exists;
        # without it the run ends green with a notice instead of a red failure.
        # Create the key under Settings > Secrets and variables > Actions.
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:PSGALLERY_API_KEY)) {
            Write-Host "::notice::PSGALLERY_API_KEY secret is not configured - skipping gallery publish. Tests and manifest validation passed."
            exit 0
          }
          Publish-Module -Path . -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          Write-Host "Published WindowsSecurityAudit to the PowerShell Gallery."
