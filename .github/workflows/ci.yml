name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and test
    # The module only works on Windows (CIM/WMI, event logs, registry), so the
    # whole job runs on windows-latest. The tests themselves are cross-platform.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer (zero Error-level findings allowed)
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($results.Count -gt 0) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 200 | Write-Host
              Write-Error "PSScriptAnalyzer reported $($results.Count) Error-level finding(s)."
              exit 1
          }
          Write-Host "PSScriptAnalyzer: 0 Error-level findings."

      - name: Import module (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module ./WindowsSecurityAudit.psd1 -Force -ErrorAction Stop
          $exported = @(Get-Command -Module WindowsSecurityAudit -CommandType Function)
          Write-Host "Imported OK, $($exported.Count) functions exported."
          if ($exported.Count -eq 0) { Write-Error "No functions were exported."; exit 1 }

      - name: Import module (Windows PowerShell 5.1)
        # The module targets Windows PowerShell 5.1+. 'shell: powershell' is the
        # Windows PowerShell 5.1 desktop edition shipped with the runner, so this
        # step proves the module still loads under 5.1 (Set-StrictMode -Version Latest
        # and 5.1-only APIs are exercised here, not under pwsh 7).
        shell: powershell
        run: |
          Import-Module ./WindowsSecurityAudit.psd1 -Force -ErrorAction Stop
          $exported = @(Get-Command -Module WindowsSecurityAudit -CommandType Function)
          Write-Host "Imported OK under $($PSVersionTable.PSVersion), $($exported.Count) functions exported."
          if ($exported.Count -eq 0) { Write-Error "No functions were exported."; exit 1 }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          # The real-Windows smoke suite runs in the dedicated 'smoke' job below
          $config.Run.ExcludePath = './tests/Smoke.Windows.Tests.ps1'
          $config.Run.Exit = $true          # exit code 1 when any test fails
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  smoke:
    name: Smoke tests (real Windows execution)
    # Runs after the structural gate: only spend smoke-test minutes on a repo
    # that already parses, lints and imports cleanly.
    needs: lint
    # GitHub-hosted windows runners are elevated, so admin-only calls (fsutil,
    # Security event log, HKLM) genuinely execute here.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Smoke tests (PowerShell 7)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Smoke.Windows.Tests.ps1'
          $config.Run.Exit = $true          # exit code 1 when any test fails
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Install Pester (Windows PowerShell 5.1)
        # 5.1 has its own CurrentUser module root (~\Documents\WindowsPowerShell\Modules),
        # so the pwsh-side install above is not visible to it.
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Smoke tests (Windows PowerShell 5.1)
        # The real-5.1-execution gate: the module targets 5.1+, so every smoke
        # test must also pass under the desktop edition.
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Smoke.Windows.Tests.ps1'
          $config.Run.Exit = $true          # exit code 1 when any test fails
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
